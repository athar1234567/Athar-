<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATHAR</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: system-ui;
}

body{
background: linear-gradient(135deg,#0f5132,#0d6efd);
color:white;
text-align:center;
min-height:100vh;
}

/* Smooth animation */
.fade{
animation: fade 1s ease-in-out;
}
@keyframes fade{
from{opacity:0; transform:translateY(10px)}
to{opacity:1;}
}

/* Header */
header{
padding:20px;
}

h1{
font-size:38px;
}

/* Glass cards */
.card{
background: rgba(255,255,255,0.1);
backdrop-filter: blur(10px);
padding:20px;
margin:15px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

/* Buttons */
button{
padding:10px 20px;
border:none;
border-radius:12px;
background:white;
color:#0d6efd;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
}

/* Input */
input{
padding:10px;
border-radius:12px;
border:none;
width:80%;
margin:10px;
}

/* Assistant */
#assistant{
position:fixed;
bottom:20px;
right:20px;
}

#chat{
display:none;
width:280px;
height:350px;
background:white;
color:black;
border-radius:20px;
padding:10px;
overflow:auto;
}

.msg{
margin:5px;
padding:8px;
border-radius:10px;
}

.user{background:#d1e7dd;}
.bot{background:#f8d7da;}

</style>
</head>

<body class="fade">

<header>
<h1>ATHAR — أثر</h1>
<p>Time with Purpose. Impact that Lasts.</p>

<button onclick="setLang('ar')">العربية</button>
<button onclick="setLang('en')">English</button>
</header>

<!-- Niyyah -->
<div class="card fade">
<h2 id="niyyahTitle">🌙 نية اليوم</h2>
<input id="niyyah" placeholder="ما نيتك اليوم؟">
<p id="saveMsg"></p>
</div>

<!-- Chart -->
<div class="card fade">
<h2>📊 إنجازك اليوم</h2>
<canvas id="chart"></canvas>
</div>

<!-- Quote -->
<div class="card fade">
<h2>💡 تذكير</h2>
<p id="quote"></p>
</div>

<!-- Assistant -->
<div id="assistant">
<button onclick="toggleChat()">🤖</button>

<div id="chat">
<div id="messages"></div>
<input id="msgInput" placeholder="اكتب..." onkeypress="if(event.key==='Enter')sendMsg()">
</div>
</div>

<script>

/* Language */
function setLang(lang){
if(lang==="en"){
document.body.dir="ltr";
document.getElementById("niyyahTitle").innerText="Daily Intention";
}else{
document.body.dir="rtl";
document.getElementById("niyyahTitle").innerText="🌙 نية اليوم";
}
}

/* Save niyyah */
document.getElementById("niyyah").addEventListener("change",()=>{
localStorage.setItem("niyyah",niyyah.value);
saveMsg.innerText="✔ تم الحفظ";
});

/* Chart */
new Chart(document.getElementById('chart'),{
type:'doughnut',
data:{
labels:['مفيد','ضائع'],
datasets:[{
data:[70,30],
backgroundColor:['#198754','#dc3545']
}]
}
});

/* Quotes */
const quotes=[
"قال ﷺ: أحب الأعمال إلى الله أدومها",
"الوقت هو الحياة",
"ابدأ يومك بنية صالحة"
];
document.getElementById("quote").innerText=
quotes[Math.floor(Math.random()*quotes.length)];

/* Assistant */
function toggleChat(){
let chat=document.getElementById("chat");
chat.style.display=chat.style.display==="none"?"block":"none";
}

function sendMsg(){
let input=document.getElementById("msgInput");
let msg=input.value;
if(!msg)return;

addMsg(msg,"user");

let reply = smartReply(msg);
setTimeout(()=>addMsg(reply,"bot"),500);

input.value="";
}

function addMsg(text,type){
let div=document.createElement("div");
div.className="msg "+type;
div.innerText=text;
document.getElementById("messages").appendChild(div);
}

/* Smart assistant */
function smartReply(msg){

msg = msg.toLowerCase();

if(msg.includes("سلام")||msg.includes("hello"))
return "أهلًا 👋 كيف أقدر أساعدك اليوم؟";

if(msg.includes("تعب")||msg.includes("lazy"))
return "خذ استراحة قصيرة ثم ارجع بطاقة أفضل 💪";

if(msg.includes("صلاة"))
return "لا تنسَ الصلاة، هي بركة يومك 🌙";

if(msg.includes("جدول"))
return "ابدأ بمهمة مهمة 45 دقيقة ثم استراحة 10 دقائق ⏱️";

if(msg.includes("هدف"))
return "حدد هدف صغير اليوم وابدأ فورًا 🚀";

return "فكرة جميلة ✨ حاول تنظيم وقتك وابدأ خطوة خطوة";
}

</script>

</body>
</html>
